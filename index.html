<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urna Eletrônica</title>
    <style>
        body {
            background-color: #e2e8f0;
            font-family: Arial, sans-serif;
        }
      #caixa_urna {
          width: 720px;
          background-color: #d1d5db;
          border: 2px solid #6b7280;
          padding: 20px;
          margin: 30px auto;
        }
      .titulo_urna {
          text-align: center;
          color: #111827;
          margin-bottom: 20px;
        }
      .tela {
         background-color: #f0fdf4;
         border: 3px solid #374151;
         padding: 15px;
         width: 390px;
         float: left;
         box-sizing: border-box;
         min-height: 310px;
        }
        .teclado {
            background-color: #1f2937;
            padding: 15px;
            width: 270px;
            float: right;
            box-sizing: border-box;
            text-align: center;
            border-radius: 5px;
        }
        .limpar_float {
            clear: both;
        }
        .campo_voto {
            margin-bottom: 15px;
        }
        .campo_voto select {
          width: 100%;
          padding: 6px;
          font-size: 14px;
          margin-top: 5px;
        }
      .linha_botoes {
            margin-bottom: 8px;
        }
        .botao_num {
          width: 50px;
          height: 40px;
          background-color: #111827;
          color: white;
          font-weight: bold;
          font-size: 16px;
          border: 1px solid #4b5563;
          margin: 2px;
          cursor: pointer;
        }
      .btn_branco {
          background-color: #ffffff;
          color: black;
          width: 70px;
          height: 35px;
          font-size: 10px;
          font-weight: bold;
          border: none;
          cursor: pointer;
        }
      .btn_corrige {
          background-color: #f97316;
          color: white;
          width: 70px;
          height: 35px;
          font-size: 10px;
          font-weight: bold;
          border: none;
          cursor: pointer;
        }
      .btn_confirma {
          background-color: #16a34a;
          color: white;
          width: 80px;
          height: 40px;
          font-size: 10px;
          font-weight: bold;
          border: none;
          cursor: pointer;
        }
    .legenda_lista {
          font-size: 12px;
          color: #374151;
           margin-top: 10px;
        }
    </style>
</head>
<body>
