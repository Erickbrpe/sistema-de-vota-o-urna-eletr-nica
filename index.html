<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urna Eletrônica</title>
    <style>
        body {
            background-color: #e2e8f0;
            font-family: Arial, sans-serif;
        }
        #caixa_urna {
            width: 720px;
            background-color: #d1d5db;
            border: 2px solid #6b7280;
            padding: 20px;
            margin: 30px auto;
        }
        .titulo_urna {
            text-align: center;
            color: #111827;
            margin-bottom: 20px;
        }
        .tela {
            background-color: #f0fdf4;
            border: 3px solid #374151;
            padding: 15px;
            width: 390px;
            float: left;
            box-sizing: border-box;
            min-height: 310px;
        }
        .teclado {
            background-color: #1f2937;
            padding: 15px;
            width: 270px;
            float: right;
            box-sizing: border-box;
            text-align: center;
        }
        .limpar_float {
            clear: both;
        }
        .visor_voto {
            margin-bottom: 20px;
        }
        .visor_voto p {
            margin: 5px 0;
            font-size: 18px;
            font-weight: bold;
        }
        .caixa_numero {
            font-size: 22px;
            width: 140px;
            text-align: center;
            padding: 5px;
            border: 2px solid #000;
            font-weight: bold;
        }
        .linha_botoes {
            margin-bottom: 8px;
        }
        .botao_num {
            width: 50px;
            height: 40px;
            background-color: #111827;
            color: white;
            font-weight: bold;
            font-size: 16px;
            border: 1px solid #4b5563;
            margin: 2px;
            cursor: pointer;
        }
        .btn_branco {
            background-color: #ffffff;
            color: black;
            width: 70px;
            height: 35px;
            font-size: 10px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .btn_corrige {
            background-color: #f97316;
            color: white;
            width: 70px;
            height: 35px;
            font-size: 10px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .btn_confirma {
            background-color: #16a34a;
            color: white;
            width: 80px;
            height: 40px;
            font-size: 10px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .legenda_lista {
            font-size: 13px;
            color: #374151;
            margin-top: 20px;
            border-top: 1px solid #ccc;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <div id="caixa_urna">
        <h2 class="titulo_urna">JUSTIÇA ELEITORAL</h2>

        <div class="tela">
            <div class="visor_voto">
                <p id="titulo_cargo">SEU VOTO PARA PRESIDENTE:</p>
                <input type="text" id="campo_voto" class="caixa_numero" readonly>
            </div>

            <div class="legenda_lista">
                <p><strong id="titulo_candidatos">CANDIDATOS A PRESIDENTE:</strong></p>
                <div id="lista_candidatos">
                    <p>13 - Lula Molusco<br>22 - Bulbassauro<br>33 - Lex Luthor</p>
                </div>
            </div>
        </div>

        <div class="teclado">
            <div class="linha_botoes">
                <button type="button" class="botao_num" onclick="digitar('1')">1</button>
                <button type="button" class="botao_num" onclick="digitar('2')">2</button>
                <button type="button" class="botao_num" onclick="digitar('3')">3</button>
            </div>
            <div class="linha_botoes">
                <button type="button" class="botao_num" onclick="digitar('4')">4</button>
                <button type="button" class="botao_num" onclick="digitar('5')">5</button>
                <button type="button" class="botao_num" onclick="digitar('6')">6</button>
            </div>
            <div class="linha_botoes">
                <button type="button" class="botao_num" onclick="digitar('7')">7</button>
                <button type="button" class="botao_num" onclick="digitar('8')">8</button>
                <button type="button" class="botao_num" onclick="digitar('9')">9</button>
            </div>
            <div class="linha_botoes">
                <button type="button" class="botao_num" onclick="digitar('0')">0</button>
            </div>
            <br>
            <div class="linha_botoes">
                <button type="button" class="btn_branco" onclick="votarBranco()">BRANCO</button>
                <button type="button" class="btn_corrige" onclick="corrige()">CORRIGE</button>
                <button type="button" class="btn_confirma" onclick="confirma()">CONFIRMA</button>
            </div>
        </div>

        <div class="limpar_float"></div>
    </div>

    <script>
        var etapa = 1;
        var numero = "";
        var eBranco = false;

        function digitar(n) {
            if (eBranco == false && numero.length < 2) {
                numero = numero + n;
                document.getElementById('campo_voto').value = numero;
            }
        }

        function votarBranco() {
            numero = "";
            eBranco = true;
            document.getElementById('campo_voto').value = "BRANCO";
        }

        function corrige() {
            numero = "";
            eBranco = false;
            document.getElementById('campo_voto').value = "";
        }

        function confirma() {
            var campo = document.getElementById('campo_voto').value;

            if (campo == "") {
                alert("Por favor, digite um número ou clique em BRANCO para votar!");
                return;
            }

            if (etapa == 1) {
                if (eBranco == true) {
                    alert("Voto em BRANCO confirmado para Presidente!");
                } else if (numero == "13") {
                    alert("Voto em Lula Molusco confirmado para Presidente!");
                } else if (numero == "22") {
                    alert("Voto em Bulbassauro confirmado para Presidente!");
                } else if (numero == "33") {
                    alert("Voto em Lex Luthor confirmado para Presidente!");
                } else {
                    alert("Voto NULO confirmado para Presidente!");
                }

                etapa = 2;
                numero = "";
                eBranco = false;
                document.getElementById('campo_voto').value = "";
                document.getElementById('titulo_cargo').innerText = "SEU VOTO PARA GOVERNADOR:";
                document.getElementById('titulo_candidatos').innerText = "CANDIDATOS A GOVERNADOR:";
                document.getElementById('lista_candidatos').innerHTML = "<p>10 - Gorila Grodd<br>20 - Coringa<br>30 - Bane</p>";

            } else if (etapa == 2) {
                if (eBranco == true) {
                    alert("Voto em BRANCO confirmado para Governador!");
                } else if (numero == "10") {
                    alert("Voto em Gorila Grodd confirmado para Governador!");
                } else if (numero == "20") {
                    alert("Voto em Coringa confirmado para Governador!");
                } else if (numero == "30") {
                    alert("Voto em Bane confirmado para Governador!");
                } else {
                    alert("Voto NULO confirmado para Governador!");
                }

                alert("FIM! Todos os votos foram computados.");

                etapa = 1;
                numero = "";
                eBranco = false;
                document.getElementById('campo_voto').value = "";
                document.getElementById('titulo_cargo').innerText = "SEU VOTO PARA PRESIDENTE:";
                document.getElementById('titulo_candidatos').innerText = "CANDIDATOS A PRESIDENTE:";
                document.getElementById('lista_candidatos').innerHTML = "<p>13 - Lula Molusco<br>22 - Bulbassauro<br>33 - Lex Luthor</p>";
            }
        }
    </script>
</body>
</html>
