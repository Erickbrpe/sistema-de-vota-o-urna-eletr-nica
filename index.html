<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urna Eletrônica</title>
    <style>
        body {
            background-color: #e2e8f0;
            font-family: Arial, sans-serif;
        }
        #caixa_urna {
            width: 720px;
            background-color: #d1d5db;
            border: 2px solid #6b7280;
            padding: 20px;
            margin: 30px auto;
        }
        .titulo_urna {
            text-align: center;
            color: #111827;
            margin-bottom: 20px;
        }
        .tela {
            background-color: #f0fdf4;
            border: 3px solid #374151;
            padding: 15px;
            width: 390px;
            float: left;
            box-sizing: border-box;
            min-height: 310px;
        }
        .teclado {
            background-color: #1f2937;
            padding: 15px;
            width: 270px;
            float: right;
            box-sizing: border-box;
            text-align: center;
        }
        .limpar_float {
            clear: both;
        }
        .visor_voto {
            margin-bottom: 20px;
        }
        .visor_voto p {
            margin: 5px 0;
            font-size: 18px;
            font-weight: bold;
        }
        .caixa_numero {
            font-size: 24px;
            width: 50px;
            text-align: center;
            padding: 5px;
            border: 2px solid #000;
        }
        .linha_botoes {
            margin-bottom: 8px;
        }
        .botao_num {
            width: 50px;
            height: 40px;
            background-color: #111827;
            color: white;
            font-weight: bold;
            font-size: 16px;
            border: 1px solid #4b5563;
            margin: 2px;
            cursor: pointer;
        }
        .btn_branco {
            background-color: #ffffff;
            color: black;
            width: 70px;
            height: 35px;
            font-size: 10px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .btn_corrige {
            background-color: #f97316;
            color: white;
            width: 70px;
            height: 35px;
            font-size: 10px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .btn_confirma {
            background-color: #16a34a;
            color: white;
            width: 80px;
            height: 40px;
            font-size: 10px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .legenda_lista {
            font-size: 13px;
            color: #374151;
            margin-top: 20px;
            border-top: 1px solid #ccc;
            padding-top: 10px;
        }
    </style>
</head>
<body>

           <div class="tela">
            <div id="bloco_gov">
            <div class="visor_voto">
                <p>SEU VOTO PARA GOVERNADOR:</p>
                <input type="text" id="gov" class="caixa_numero" maxlength="2" readonly>
                </div>
                <div class="legenda_lista">
                    <p><strong>CANDIDATOS A GOVERNADOR:</strong></p>
                    <p>10 - Gorila Grodd<br>20 - Coringa<br>30 - Bane</p>
                </div>
            </div>
               
            <div id="bloco_pres" style="display: none;">
                <div class="visor_voto">
                    <p>SEU VOTO PARA PRESIDENTE:</p>
                    <input type="text" id="pres" class="caixa_numero" maxlength="2" readonly>
                </div>
                <div class="legenda_lista">
                    <p><strong>CANDIDATOS A PRESIDENTE:</strong></p>
                    <p>13 - Lula Molusco<br>22 - Bulbassauro<br>33 - Lex Luthor</p>
                </div>
            </div>

            <div id="bloco_fim" style="display: none; font-size: 50px; font-weight: bold; text-align: center; margin-top: 70px;">
                FIM
            </div>
        </div>

        <div class="teclado">
            <div class="linha_botoes">
                <button type="button" class="botao_num" onclick="digitar('1')">1</button>
                <button type="button" class="botao_num" onclick="digitar('2')">2</button>
                <button type="button" class="botao_num" onclick="digitar('3')">3</button>
            </div>
            <div class="linha_botoes">
                <button type="button" class="botao_num" onclick="digitar('4')">4</button>
                <button type="button" class="botao_num" onclick="digitar('5')">5</button>
                <button type="button" class="botao_num" onclick="digitar('6')">6</button>
            </div>
            <div class="linha_botoes">
                <button type="button" class="botao_num" onclick="digitar('7')">7</button>
                <button type="button" class="botao_num" onclick="digitar('8')">8</button>
                <button type="button" class="botao_num" onclick="digitar('9')">9</button>
            </div>
            <div class="linha_botoes">
                <button type="button" class="botao_num" onclick="digitar('0')">0</button>
            </div>
            <br>
            <div class="linha_botoes">
                <button type="button" class="btn_branco" onclick="limpar()">BRANCO</button>
                <button type="button" class="btn_corrige" onclick="limpar()">CORRIGE</button>
                <button type="button" class="btn_confirma" onclick="confirmar()">CONFIRMA</button>
            </div>
        </div>

        <div class="limpar_float"></div>
    </div>

    <script>
        var etapa = 'gov'; 

        function digitar(numero) {
            if (etapa === 'gov') {
            var gov = document.getElementById('gov');
            if (gov.value.length < 2) gov.value += numero;
            } else if (etapa === 'pres') {
            var pres = document.getElementById('pres');
            if (pres.value.length < 2) pres.value += numero;
            }
        }

        function limpar() {
            if (etapa === 'gov') {
                document.getElementById('gov').value = "";
            } else if (etapa === 'pres') {
                document.getElementById('pres').value = "";
            }
        }

        function confirmar() {
            if (etapa === 'gov') {
            var gov = document.getElementById('gov').value;
            if (gov === "") return; 

            if (gov == "10") {
                    alert("Você votou em: Gorila Grodd para Governador!");
            } else if (gov == "20") {
                    alert("Você votou em: Coringa para Governador!");
            } else if (gov == "30") {
                    alert("Você votou em: Bane para Governador!");
            } else {
                    alert("Voto NULO para Governador!");
                }

            etapa = 'pres';
            document.getElementById('bloco_gov').style.display = 'none';
            document.getElementById('bloco_pres').style.display = 'block';

            } else if (etapa === 'pres') {
            var pres = document.getElementById('pres').value;
            if (pres === "") return; 

            if (pres == "11") {
                alert("Você votou em: Lula Molusco para Presidente!");
            } else if (pres == "22") {
                alert("Você votou em: Bulbassauro para Presidente!");
            } else if (pres == "33") {
                alert("Você votou em: Lex Luthor para Presidente!");
             } else {
                alert("Voto NULO para Presidente!");
             }
 
        etapa = 'fim';
        document.getElementById('bloco_pres').style.display = 'none';
        document.getElementById('bloco_fim').style.display = 'block';
        }
        }
</script>
</body>
</html>
